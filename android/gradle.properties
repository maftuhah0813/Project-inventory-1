
# Gradle memory optimization for low-RAM laptop
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError -XX:ActiveProcessorCount=2 -Dfile.encoding=UTF-8

# Reduce Gradle resource usage
org.gradle.workers.max=1
org.gradle.parallel=false
org.gradle.daemon=false

android.useAndroidX=true

# Flutter template settings
android.newDsl=false
android.builtInKotlin=false

# Disable Kotlin incremental compilation
kotlin.incremental=false
